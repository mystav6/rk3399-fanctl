<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fan Control · T4 Dashboard</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap');

  :root {
    --bg:#111318;--surface:#1c2027;--surface2:#242931;--border:#2e3541;
    --text:#e8edf3;--text2:#a8b3c0;--muted:#6b7785;
    --ok:#4ac76b;--ok-bg:rgba(74,199,107,0.12);--ok-border:rgba(74,199,107,0.25);
    --warn:#e0a030;--warn-bg:rgba(224,160,48,0.12);--warn-border:rgba(224,160,48,0.25);
    --fail:#f0524f;--fail-bg:rgba(240,82,79,0.12);--fail-border:rgba(240,82,79,0.25);
    --t4:#5b9cf6;--t4-dim:rgba(91,156,246,0.15);
    --t41:#4ac76b;--t41-dim:rgba(74,199,107,0.15);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:'IBM Plex Sans',sans-serif;font-size:15px;padding:24px 20px}
  .section-title{font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;margin-bottom:16px}
  .fan-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden}
  .card-stripe{height:4px}
  .stripe-t4{background:var(--t4)}.stripe-t41{background:var(--t41)}
  .card-inner{padding:20px}
  .card-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:16px}
  .card-title{font-family:'IBM Plex Mono',monospace;font-size:17px;font-weight:600;letter-spacing:.05em}
  .t4-color{color:var(--t4)}.t41-color{color:var(--t41)}
  .card-meta{text-align:right;font-family:'IBM Plex Mono',monospace;line-height:1.8}
  .hostname{font-size:13px;color:var(--text2);display:block}
  .age{font-size:12px;color:var(--muted);display:block}
  .age.stale{color:var(--fail);font-weight:600}

  /* Refresh button - same style as your dashboard action buttons */
  .btn-refresh{
    display:inline-flex;align-items:center;justify-content:center;gap:6px;
    font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:600;letter-spacing:.06em;
    padding:5px 12px;border-radius:6px;border:1px solid var(--border);
    background:var(--surface2);color:var(--text2);cursor:pointer;
    transition:all .2s;margin-bottom:14px;width:100%;
  }
  .btn-refresh:hover:not(:disabled){background:var(--t4-dim);color:var(--t4);border-color:rgba(91,156,246,.3)}
  .btn-refresh:disabled{opacity:.5;cursor:not-allowed}
  .btn-refresh.loading{color:var(--warn);border-color:var(--warn-border)}
  .btn-refresh.success{color:var(--ok);border-color:var(--ok-border);background:var(--ok-bg)}
  .btn-refresh.error{color:var(--fail);border-color:var(--fail-border);background:var(--fail-bg)}

  .divider{height:1px;background:var(--border);margin:14px 0}
  .section-label{font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;margin-bottom:10px}

  .fan-state{
    display:inline-flex;align-items:center;gap:6px;
    font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:600;
    padding:4px 10px;border-radius:6px;margin-bottom:14px;letter-spacing:.06em;
  }
  .fan-state.on{background:var(--ok-bg);color:var(--ok);border:1px solid var(--ok-border)}
  .fan-state.off{background:var(--surface2);color:var(--muted);border:1px solid var(--border)}
  .fan-state.warn{background:var(--warn-bg);color:var(--warn);border:1px solid var(--warn-border)}

  .meters{display:flex;flex-direction:column}
  .meter-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--border)}
  .meter-row:last-child{border-bottom:none}
  .meter-label{font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--text2);width:52px;flex-shrink:0}
  .bar-bg{flex:1;height:7px;background:var(--surface2);border-radius:4px;overflow:hidden}
  .bar-fill{height:100%;border-radius:4px;transition:width .5s ease}
  .bar-fill.ok{background:var(--ok)}.bar-fill.warn{background:var(--warn)}
  .bar-fill.fail{background:var(--fail)}.bar-fill.off{background:var(--muted);opacity:.3}
  .meter-val{font-family:'IBM Plex Mono',monospace;font-size:14px;font-weight:600;width:60px;text-align:right;flex-shrink:0}
  .meter-val.ok{color:var(--ok)}.meter-val.warn{color:var(--warn)}
  .meter-val.fail{color:var(--fail)}.meter-val.off{color:var(--muted)}

  .levels-panel{margin-top:14px;padding:12px;background:var(--surface2);border:1px solid var(--border);border-radius:8px}
  .levels-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  .levels-label{font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
  .levels-current{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--text2)}
  .levels-dots{display:flex;align-items:center;gap:6px;margin-bottom:8px}
  .level-dot{width:12px;height:12px;border-radius:50%;border:2px solid var(--border);background:var(--surface);transition:all .3s;flex-shrink:0}
  .level-dot.active{border-color:var(--ok);background:var(--ok);box-shadow:0 0 6px rgba(74,199,107,.5)}
  .level-dot.past{border-color:var(--ok);background:var(--ok-bg)}
  .levels-separator{flex:1;height:1px;background:var(--border);min-width:8px}
  .levels-config{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--muted)}

  .placeholder{font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--muted);padding:12px 0;text-align:center}
  .placeholder.error{color:var(--warn)}
</style>
</head>
<body>

<div class="section-title">Fan Control · rk3399-fanctl</div>

<div class="fan-grid">
  <!-- T4-1 -->
  <div class="card">
    <div class="card-stripe stripe-t41"></div>
    <div class="card-inner">
      <div class="card-header">
        <span class="card-title t41-color">T4-1 · Fan</span>
        <div class="card-meta">
          <span class="hostname" id="t41-host">—</span>
          <span class="age"      id="t41-age">—</span>
        </div>
      </div>
      <button class="btn-refresh" id="btn-t41" onclick="refreshFan('t41')">↻ Refresh live data</button>
      <div id="t41-body"><div class="placeholder">Press Refresh to load live fan data</div></div>
    </div>
  </div>

  <!-- T4-2 -->
  <div class="card">
    <div class="card-stripe stripe-t4"></div>
    <div class="card-inner">
      <div class="card-header">
        <span class="card-title t4-color">T4-2 · Fan</span>
        <div class="card-meta">
          <span class="hostname" id="t42-host">—</span>
          <span class="age"      id="t42-age">—</span>
        </div>
      </div>
      <button class="btn-refresh" id="btn-t42" onclick="refreshFan('t42')">↻ Refresh live data</button>
      <div id="t42-body"><div class="placeholder">Press Refresh to load live fan data</div></div>
    </div>
  </div>
</div>

<script>
// ── CONFIG ── adjust if loading standalone outside Pi5 nginx
const API_BASE = '';  // e.g. 'http://192.168.0.109:9999'

function pwmClass(pct) {
  if (pct === 0) return 'off';
  if (pct < 40)  return 'ok';
  if (pct < 70)  return 'warn';
  return 'fail';
}

function levelsDots(current, total) {
  if (!total) return '<span style="color:var(--muted);font-size:12px">—</span>';
  let h = '';
  for (let i = 0; i < total; i++) {
    const c = i === current ? 'active' : i < current ? 'past' : '';
    h += `<div class="level-dot ${c}" title="Level ${i}"></div>`;
    if (i < total - 1) h += '<div class="levels-separator"></div>';
  }
  return h;
}

function meterRow(label, barPct, valStr, cls) {
  return `<div class="meter-row">
    <span class="meter-label">${label}</span>
    <div class="bar-bg"><div class="bar-fill ${cls}" style="width:${Math.min(barPct,100)}%"></div></div>
    <span class="meter-val ${cls}">${valStr}</span>
  </div>`;
}

function renderFan(fan) {
  const pct   = fan.pwm_pct  ?? 0;
  const pwm   = fan.pwm      ?? 0;
  const pwmMax= fan.pwm_max  ?? 255;
  const state = fan.state    ?? 'unknown';
  const lvl   = fan.cooling_level        ?? 0;
  const total = fan.cooling_levels_total ?? 0;
  const cfgLvl= fan.configured_levels   ?? '';
  const cls   = pwmClass(pct);

  return `
    <div class="fan-state ${state === 'on' ? 'on' : 'off'}">${state === 'on' ? '▶ RUNNING' : '■ STOPPED'}</div>
    <div class="section-label">PWM Output</div>
    <div class="meters">
      ${meterRow('PWM',  pct, `${pwm} / ${pwmMax}`, cls)}
      ${meterRow('Load', pct, `${pct}%`,             cls)}
    </div>
    <div class="levels-panel">
      <div class="levels-header">
        <span class="levels-label">Cooling level</span>
        <span class="levels-current">${lvl + 1} / ${total || '?'}</span>
      </div>
      <div class="levels-dots">${levelsDots(lvl, total)}</div>
      ${cfgLvl ? `<div class="levels-config">configured: ${cfgLvl}</div>` : ''}
    </div>`;
}

async function refreshFan(device) {
  const btn    = document.getElementById(`btn-${device}`);
  const bodyEl = document.getElementById(`${device}-body`);
  const hostEl = document.getElementById(`${device}-host`);
  const ageEl  = document.getElementById(`${device}-age`);

  btn.disabled = true;
  btn.className = 'btn-refresh loading';
  btn.textContent = '⟳ Loading…';
  bodyEl.innerHTML = '<div class="placeholder">Fetching live data via SSH…</div>';

  try {
    const r    = await fetch(`${API_BASE}/api/fan/status/${device}`);
    const data = await r.json();
    if (!data.ok || !data.fan) throw new Error(data.error || 'No fan data');

    hostEl.textContent = device === 't41' ? 'nanopct4-1' : 'nanopct4-2';
    ageEl.textContent  = 'live · ' + new Date().toLocaleTimeString('en-GB',
      {hour:'2-digit', minute:'2-digit', second:'2-digit'});
    ageEl.className = 'age';

    bodyEl.innerHTML = renderFan(data.fan);
    btn.className = 'btn-refresh success';
    btn.textContent = '✓ Updated';

  } catch(err) {
    bodyEl.innerHTML = `<div class="placeholder error">⚠ ${err.message}</div>`;
    hostEl.textContent = '—';
    ageEl.textContent  = 'error';
    btn.className  = 'btn-refresh error';
    btn.textContent = '✗ Failed — retry';
    btn.disabled   = false;
    return;
  }

  setTimeout(() => {
    btn.disabled    = false;
    btn.className   = 'btn-refresh';
    btn.textContent = '↻ Refresh live data';
  }, 3000);
}
</script>
</body>
</html>
