name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck

      - name: Run shellcheck
        run: |
          shellcheck -s sh \
            scripts/rk3399-fanctl \
            scripts/common.sh \
            scripts/dtb-lib.sh \
            scripts/kernel-hook.sh

  test:
    name: unit tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get install -y device-tree-compiler

      - name: Run tests
        run: make test

  build:
    name: build .deb
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: sudo apt-get install -y dpkg-dev device-tree-compiler shellcheck

      - name: Build .deb package
        run: bash build.sh

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: deb-package
          path: dist/*.deb
          retention-days: 7

  changelog:
    name: changelog check
    runs-on: ubuntu-latest
    # Kontrola pouze u Pull Requestů - ne při přímém push na main
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check CHANGELOG.md was updated
        run: |
          if ! git diff --name-only origin/main...HEAD | grep -q "CHANGELOG.md"; then
            echo "::warning::CHANGELOG.md nebyl v tomto PR aktualizován."
            echo "Zvažte přidání záznamu do sekce [Unreleased]."
            # Pouze varování, ne chyba - nechceme blokovat malé PR
          else
            echo "✓ CHANGELOG.md byl aktualizován"
          fi
