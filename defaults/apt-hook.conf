// apt.conf.d snippet pro rk3399-fanctl
// Spustí se po každém apt upgrade jako pojistka
// (primární hook je /etc/kernel/postinst.d/rk3399-fanctl)
DPkg::Post-Invoke {
    "if [ -x /usr/sbin/rk3399-fanctl ] && [ -f /var/lib/rk3399-fanctl/state ]; then /usr/sbin/rk3399-fanctl --reapply 2>/dev/null || true; fi";
};
